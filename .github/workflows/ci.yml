name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Host test and preview smoke
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; the bundle and libelf1t64 are checked on 24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Shell syntax and Python scripts compile
        run: |
          sudo apt-get install -y -qq zsh > /dev/null
          zsh -n tools/preview/build.zsh
          zsh -n source/gfx/programs.zsh
          zsh -n sdk_setup.sh
          python3 -I -m py_compile art/make_font.py tools/preview/diff.py tools/preview/smoke/check_tex8.py

      - name: Host test (the freeze journal in a temp folder)
        run: |
          cc -std=c99 -Wall -Wextra -I tools/preview/stub -I source -o test_journal test/test_journal.c source/journal.c source/fs.c test/lv2fs_stub.c
          ./test_journal

      - name: Host test (the one-line files in a temp folder)
        run: |
          cc -std=c99 -Wall -Wextra -I tools/preview/stub -I source -o test_fs test/test_fs.c source/fs_line.c source/fs.c test/lv2fs_stub.c
          ./test_fs

      - name: Host test (gfx's front end on a recording back end, an area of 409 vertices)
        run: |
          cc -std=c99 -Wall -Wextra -DGFX_VTX_BYTES=8192 -I tools/preview/stub -I source/gfx -o test_gfx test/test_gfx.c source/gfx/gfx.c
          ./test_gfx

      - name: Host test (the SPU kit's report and arguments, the local-store kernel with injected faults)
        run: |
          cc -std=c99 -Wall -Wextra -I source -o test_spu_kit test/test_spu_kit.c
          ./test_spu_kit

      - name: Preview smoke (the world on gcc, one snapshot)
        run: |
          zsh tools/preview/build.zsh APP=tools/preview/smoke
          t=$(mktemp -d)
          mkdir -p "$t/dev_hdd0/tmp"
          PV_ROOT=$t PV_OUT=$t PV_SCRIPT="3:SNAP=home 4:EXIT" tools/preview/smoke/tools/preview/build/pv
          test -s "$t/home.ppm"
          head -c 2 "$t/home.ppm" | grep -q P6
          grep -q start "$t/dev_hdd0/tmp/ps3gfx_smoke/starts.txt"
          python3 -I tools/preview/smoke/check_tex8.py "$t/home.ppm"

      - name: Kit check (the kit's rules on the preview, a screenshot against a snapshot)
        run: |
          zsh tools/preview/build.zsh APP=tools/preview/kitcheck
          t=$(mktemp -d)
          mkdir -p "$t/dev_hdd0/tmp"
          PV_ROOT=$t PV_OUT=$t PV_SCRIPT="10-70:DOWN 80-82:DOWN 50:SNAP=kit" tools/preview/kitcheck/tools/preview/build/pv
          cmp "$t/kit.ppm" "$t/dev_hdd0/tmp/ps3gfx_kitcheck/shot.ppm"

  ppu:
    name: PS3 archive (Linux ps3dev bundle)
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to 26.04 from 2026-10-19; the bundle and libelf1t64 are checked on 24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/ps3dev-sdk

      # On every push, not only on a cache miss: the cache holds whichever
      # archive first filled it.
      - name: make and make install
        run: |
          make
          make install
          ls -la lib/libps3gfx.a "$PS3DEV/portlibs/ppu/lib/libps3gfx.a" "$PS3DEV/portlibs/ppu/include/ps3gfx" "$PS3DEV/portlibs/ppu/share/ps3gfx"
          cat "$PS3DEV/portlibs/ppu/share/ps3gfx/COMMIT"

      # make embeds the committed data/spu_kit.spu and needs no spu-gcc. Here
      # the bundle's spu-gcc builds the program again: a difference fails the
      # job, and the log then has the CI build in base64. A heap would start
      # at _end, inside the local-store test's area: no malloc, sbrk or printf
      # symbol, and _end at most 0x8000 keeps the area over 200 KB.
      - name: SPU kit (spu-gcc gives the committed bytes, no heap or printf, _end at most 0x8000)
        run: |
          make -C spu
          sha256sum spu/build/spu_kit.spu data/spu_kit.spu
          cmp spu/build/spu_kit.spu data/spu_kit.spu || { echo "spu/build/spu_kit.spu differs from data/spu_kit.spu; the CI build in base64:"; base64 < spu/build/spu_kit.spu; exit 1; }
          "$PS3DEV/spu/bin/spu-nm" spu/build/spu_kit.elf > spu_nm.txt
          heap=$(awk '$NF ~ /malloc|sbrk|printf/ {print $NF}' spu_nm.txt | tr '\n' ' ')
          if [ -n "$heap" ]; then echo "heap or printf symbols in the SPU program: $heap"; exit 1; fi
          end=$(awk '$NF == "_end" {print $1}' spu_nm.txt)
          if [ -z "$end" ] || [ $((0x$end)) -gt $((0x8000)) ]; then echo "_end 0x$end: not found or over 0x8000"; exit 1; fi
          echo "_end 0x$end, data/spu_kit.spu $(wc -c < data/spu_kit.spu) bytes"

      # The four functions are D (PPC64 ELFv1: the global symbol is the
      # function descriptor in .opd), fonts_bin, latin_bin, spu_kit_spu and
      # spu_kit_spu_size are R. The SPU kit's member must keep its 128-byte
      # alignment (bin2s -a 128; bin2o gives 64). Every undefined symbol
      # that another member does not define must be PSL1GHT's or the
      # toolchain's (newlib, libsysbase): the sysLv2Fs* calls are inline
      # syscalls, never U.
      - name: ppu-nm checks (the public names, no undefined symbol outside PSL1GHT and newlib)
        run: |
          ppu-nm lib/libps3gfx.a > nm.txt
          for s in gfx_init ui_init journal_start text_utf8; do grep -Eq " [TD] $s\$" nm.txt || { echo "no $s in the archive"; exit 1; }; done
          for s in fonts_bin latin_bin spu_kit_spu spu_kit_spu_size; do grep -Eq " R $s\$" nm.txt || { echo "no $s in the archive"; exit 1; }; done
          ppu-objdump -h lib/libps3gfx.a | awk '/^spu_kit\.spu\.o:/{m=1} m && $2==".rodata"{print $NF; exit}' | grep -qx '2\*\*7' || { echo "spu_kit.spu.o: .rodata is not 128-byte aligned"; exit 1; }
          awk '$1=="U"{u[$2]=1} ($2 ~ /^[TRDBC]$/){d[$3]=1} END{for(s in u) if(!(s in d)) print s}' nm.txt | sort > undefined.txt
          cat > allowed.txt <<'EOF'
          cosf
          exit
          floorf
          free
          gcmAddressToOffset
          gcmGetConfiguration
          gcmGetControlRegister
          gcmGetFlipStatus
          gcmGetLabelAddress
          gcmInitBody
          gcmResetFlipStatus
          gcmSetDisplayBuffer
          gcmSetFlip
          gcmSetFlipMode
          gcmSetWaitFlip
          ioPadEnd
          ioPadGetData
          ioPadGetInfo
          ioPadInit
          malloc
          memalign
          memcpy
          sinf
          snprintf
          sqrtf
          sscanf
          strcat
          strchr
          strcmp
          strlen
          strncmp
          strstr
          strtok
          sysGetSystemTime
          sysThreadCreate
          sysThreadExit
          sysUtilCheckCallback
          sysUtilRegisterCallback
          sysUtilUnregisterCallback
          usleep
          videoConfigure
          videoGetResolution
          videoGetState
          vsnprintf
          EOF
          extra=$(comm -23 undefined.txt allowed.txt)
          if [ -n "$extra" ]; then echo "undefined symbols outside the allowlist: $extra"; exit 1; fi
          echo "undefined symbols: $(tr '\n' ' ' < undefined.txt)"

      # Later, when PS3 Health links the library (design section 4): a checkout
      # of Health at a pinned sha, its sdk_setup.sh, this commit installed over
      # the pinned archive, make -C health pkg and Health's tools/syscalls.py on
      # its ELF.
